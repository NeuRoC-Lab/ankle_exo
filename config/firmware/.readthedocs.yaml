version: 2

build:
  os: ubuntu-24.04

  tools:
    python: "3.13"

  apt_packages:
    - doxygen
    - graphviz

  jobs:
    post_install:
      - pip install sphinx breathe sphinx-rtd-theme myst-parser

    pre_build:
      - cd docs/firmware && doxygen Doxyfile

sphinx:
  configuration: docs/firmware/source/conf.py