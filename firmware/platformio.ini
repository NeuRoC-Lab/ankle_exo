; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:main-teensy]
platform = teensy
board = teensy41
monitor_speed = 230400
framework = arduino
build_src_filter =
    -<*>
    +<teensy.cpp>
build_flags =
    -D PLATFORM_TEENSY
lib_deps =
    https://github.com/tonton81/FlexCAN_T4.git
    bakercp/PacketSerial@^1.4.0
    dunknowcoding/INA Series Sensor@^0.5.4

targets=upload

[env:main-nano]
platform = nordicnrf52
board = nano33ble
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<nano.cpp>
build_flags =
    -D PLATFORM_NANO



build_src_flags =
    -std=gnu++17

; we require c++17 for using things like std::clamp. The nano otherwise compiles in an older version of c++

lib_deps =
    bakercp/PacketSerial@^1.4.0
    arduino-libraries/ArduinoBLE@^2.1.0
;targets=upload