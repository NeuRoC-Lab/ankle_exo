; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
monitor_speed = 115200


; ================ ONE LEG SETUP MAIN SCRIPT =====================

[env:one_leg_teensy41]
; The Teensy-related script for main.cpp
platform = teensy
board = teensy41
framework = arduino
build_src_filter =
    -<*>
    +<main.cpp>
build_flags =
    -D PLATFORM_TEENSY41
    -D MIT_MODE
lib_deps =
    https://github.com/tonton81/FlexCAN_T4.git
    bblanchon/ArduinoJson@^7.4.3
targets=upload
[env:one_leg_uno_r4]
; The Arduino uno R4 -related script for main.cpp
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
build_src_filter =
    -<*>
    +<main.cpp>
build_flags =
    -D MIT_MODE
    -D PLATFORM_RENESAS_RA

lib_deps =
    bblanchon/ArduinoJson@^7.4.3

targets=upload , monitor

[env:one_leg_nano]
; The Arduino uno R4 -related script for main.cpp
platform = nordicnrf52
board = nano33ble
framework = arduino
build_src_filter =
    -<*>
    +<main.cpp>
build_flags =
    -D PLATFORM_NORDIC

lib_deps =
    arduino-libraries/ArduinoBLE@^2.1.0
    bblanchon/ArduinoJson@^7.4.3

lib_ignore =
    Arduino_CAN
    ArduinoJson
;targets=upload , monitor
